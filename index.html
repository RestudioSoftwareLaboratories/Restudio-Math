<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Restudio Math</title>
    <link rel="icon" href="https://i.postimg.cc/66MLbbg8/restudio-profile.png" type="image/png">
    
    <!-- Content Security Policy -->
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self';
        script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net;
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net;
        style-src-elem 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net;
        font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net data:;
        img-src 'self' https://i.postimg.cc data:;
        connect-src 'self';
        frame-src 'none';
        object-src 'none';
        base-uri 'self';
        form-action 'self';
    ">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tiny5&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css">
    <!-- KaTeX -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Integrated top bar -->
    <header class="top-bar">
        <!-- First row: Logo - Black background -->
        <div class="top-bar-primary">
            <div class="top-left">
                <img class="logo" src="https://i.postimg.cc/s2j0rzBZ/swrh-restudio.png" alt="Logo">
                <span class="brand-text">math</span>
            </div>
        </div>
        
        <!-- Second row: All tools and symbols - Background #2D2D2D -->
        <div class="top-bar-tools">
            <!-- Operations group -->
            <div class="tool-group">
                <span class="tool-group-label">OPERATIONS</span>
                <button class="tool-btn" id="newBtn"><i class="ti ti-file-plus"></i> New</button>
                <button class="tool-btn" id="openBtn"><i class="ti ti-folder-open"></i> Open .REMT</button>
                <button class="tool-btn" id="saveBtn"><i class="ti ti-device-floppy"></i> Export .REMT</button>
            </div>
            
            <!-- Insert group -->
            <div class="tool-group">
                <span class="tool-group-label">INSERT</span>
                <button class="tool-btn" id="fracBtn"><i class="ti ti-123"></i> Fraction</button>
                <button class="tool-btn" id="rootBtn"><i class="ti ti-square-root"></i> Root</button>
                <button class="tool-btn" id="powerBtn"><i class="ti ti-exponent"></i> Power</button>
                <button class="tool-btn" id="katexBtn"><i class="ti ti-info-circle"></i> KaTeX Help</button>
            </div>
            
            <!-- Direct symbols group -->
            <div class="tool-group">
                <span class="tool-group-label">SYMBOLS</span>
                <div class="symbols-group" id="symbolsGrid">
                    <button class="sym-btn" data-sym="+">+</button>
                    <button class="sym-btn" data-sym="-">-</button>
                    <button class="sym-btn" data-sym="\\times">×</button>
                    <button class="sym-btn" data-sym="\\div">÷</button>
                    <button class="sym-btn" data-sym="=">=</button>
                    <button class="sym-btn" data-sym="\\neq">≠</button>
                    <button class="sym-btn" data-sym="<">&lt;</button>
                    <button class="sym-btn" data-sym=">">&gt;</button>
                    <button class="sym-btn" data-sym="\\leq">≤</button>
                    <button class="sym-btn" data-sym="\\geq">≥</button>
                    <button class="sym-btn" data-sym="\\pi">π</button>
                    <button class="sym-btn" data-sym="\\alpha">α</button>
                    <button class="sym-btn" data-sym="\\beta">β</button>
                    <button class="sym-btn" data-sym="\\gamma">γ</button>
                    <button class="sym-btn" data-sym="\\infty">∞</button>
                </div>
            </div>
        </div>
    </header>

    <div class="main-container">
        <!-- Preview area only - all tools are in the top bar -->
        <div class="preview-area">
            <div class="preview-title">LATEX EXPRESSION</div>
            <textarea id="latexInput" class="latex-input" rows="3" placeholder="Write LaTeX code here...&#10;Example: \frac{-b \pm \sqrt{b^2 - 4ac}}{2a}"></textarea>
            
            <div class="preview-title">PREVIEW</div>
            <div id="previewBox" class="preview-box">
                \( \displaystyle \text{Equation will appear here...} \)
            </div>
            <div id="errorMsg" class="error-message"></div>
            
            <div class="info-note">
                Use buttons in the top bar to insert symbols and operations. The preview updates automatically using KaTeX.
            </div>
        </div>
    </div>

    <!-- Bottom bar -->
    <footer class="bottom-bar">
        <div class="status">
            <i class="ti ti-check-circle"></i>
            <span>Ready</span>
        </div>
        <div class="status">
            <i class="ti ti-function"></i>
            <span id="charCount">0</span>
            <span>chars</span>
        </div>
        <button class="bottom-bar-btn" id="clearBtn">
            <i class="ti ti-trash"></i>
            Clear All
        </button>
        <button class="bottom-bar-btn" id="copyBtn">
            <i class="ti ti-copy"></i>
            Copy LaTeX
        </button>
    </footer>

    <script src="script.js"></script>
</body>
</html>
